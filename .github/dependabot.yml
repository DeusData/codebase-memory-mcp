version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/graph-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      graph-ui-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

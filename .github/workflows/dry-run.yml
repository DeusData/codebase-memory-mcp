# Manual trigger: test everything before pushing a release.
# Each step can be skipped for faster iteration.
#
# Pipeline:  lint → test → build → smoke/soak → virustotal   (sequential chain)
# Security:  security-static + codeql-gate                    (independent island)
#
# Security does NOT block lint/test/build/smoke/soak. All jobs must pass
# for the overall workflow to be green.
#
# VirusTotal runs LAST and scans the same artifacts the release scans, so a
# detection surfaces here instead of mid-release. It is the one dry-run job
# whose verdict does not depend on our code: the same unchanged bytes can come
# back clean one day and flagged the next, which is precisely why finding out
# during a dry run is worth the wait.
#
# The skips are independent because they answer different questions:
#   skip_builds      no artifacts at all             "do lint and tests pass?"
#   skip_smoke       build + scan, no smoke          "does this diff scan red?"
#   skip_virustotal  build + smoke + soak, no scan   "do the archives pass CI?"
#
# skip_virustotal exists because the scan costs API quota and polls for up to
# two hours, which is pure noise while iterating on a build or smoke failure.
#
# skip_smoke is the opposite trip: go straight from build to VirusTotal when the
# question is only whether a diff turns the scan red. Smoke is in the VirusTotal
# job's needs, so without this a smoke failure would withhold exactly the answer
# such a run was dispatched to get.
name: Dry Run

on:
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip lint (cppcheck + clang-format)'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip unit/integration tests'
        type: boolean
        default: false
      skip_builds:
        description: 'Skip build + smoke (also skips VirusTotal — nothing to scan)'
        type: boolean
        default: false
      skip_smoke:
        description: 'Skip smoke (build straight to VirusTotal)'
        type: boolean
        default: false
      skip_virustotal:
        description: 'Skip VirusTotal scan (still builds + smokes the archives)'
        type: boolean
        default: false
      soak_level:
        description: 'Soak: full (quick+asan), quick (10min), none'
        type: choice
        options: ['full', 'quick', 'none']
        default: 'quick'

permissions:
  contents: read

jobs:
  # ── Security (independent island — does not block main pipeline) ──
  security:
    uses: ./.github/workflows/_security.yml
    secrets: inherit

  # ── Lint (cppcheck + clang-format) ────────────────────────────
  lint:
    if: ${{ inputs.skip_lint != true }}
    uses: ./.github/workflows/_lint.yml

  # ── Tests (all platforms, perf tests skipped on CI) ────────────
  test:
    needs: [lint]
    if: ${{ inputs.skip_tests != true && !cancelled() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true
      broad_platforms: true
      shard_suites: true

  # ── Build all platforms ────────────────────────────────────────
  build:
    if: ${{ inputs.skip_builds != true && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build.yml
    with:
      attest: false

  # ── Smoke test every binary ────────────────────────────────────
  # Run unless builds were skipped or a build leg FAILED. Every build leg
  # (including the macos-15-intel darwin-amd64 binary) is blocking now, so a
  # failed/missing platform binary correctly stops smoke — see _build.yml.
  smoke:
    if: ${{ inputs.skip_builds != true && inputs.skip_smoke != true && !cancelled() && needs.build.result != 'failure' && needs.build.result != 'skipped' }}
    needs: [build]
    uses: ./.github/workflows/_smoke.yml
    with:
      broad_platforms: true

  # ── Soak tests (optional, parallel with smoke) ────────────────
  soak:
    if: ${{ inputs.soak_level != 'none' && !cancelled() && needs.build.result != 'failure' && needs.build.result != 'skipped' }}
    needs: [build]
    uses: ./.github/workflows/_soak.yml
    with:
      duration_minutes: 10
      run_asan: ${{ inputs.soak_level == 'full' }}

  # ── VirusTotal (final step) ────────────────────────────────────
  # Mirrors the release workflow's scan so a dry run answers the question the
  # release will ask, before we tag anything. The only difference is where the
  # archives come from: the release pulls them off a published release, a dry
  # run has none, so they come from the build job's artifacts — the SAME files,
  # produced by the same canonical package-release.sh.
  #
  # Runs after smoke and soak deliberately. It is the slowest job (polling can
  # take up to two hours) and the one most likely to be waiting on someone
  # else's queue, so it must not delay the feedback that is actually about our
  # code.
  #
  # It needs smoke and soak only so it runs LAST, not because it depends on
  # them: a skipped smoke or soak leaves the scan reachable (result 'skipped',
  # which is not 'failure'), while a FAILED one withholds it — if the artifacts
  # are broken, a verdict on them is not worth two hours of polling.
  virustotal:
    if: ${{ inputs.skip_builds != true && inputs.skip_virustotal != true && !cancelled() && needs.build.result == 'success' && needs.smoke.result != 'failure' && needs.soak.result != 'failure' }}
    needs: [build, smoke, soak]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-archives

      # Same extraction the release verify job performs. VirusTotal receives
      # only extracted files and unpacked UI assets, never .tar.gz/.zip containers.
      - name: Extract archive artifacts
        run: |
          scripts/ci/extract-release-archives.sh "$RUNNER_TEMP/release-archives" binaries \
            --archive-scope=ui \
            --expect-archives=8 \
            --expect-binaries=8 \
            --expect-packs=8 \
            --expect-runtime-files=32

      - name: VirusTotal scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        id: virustotal
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_SCANNER_API_KEY }}
          files: binaries/objects/*
          request_rate: 4

      # Same ZERO-tolerance gate as the release. Every extracted object must arrive
      # naturally clean; any malicious or suspicious verdict fails this run.
      - name: Wait for VirusTotal results
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_SCANNER_API_KEY }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
          VT_EXPECTED_SCAN_SET: binaries/scan-set.tsv
          VT_ASSOCIATIONS: binaries/associations.tsv
          VT_RESULTS_PATH: binaries/vt-results.tsv
          MIN_ENGINES: 50
        run: scripts/ci/check-virustotal.sh

      - name: Preserve VirusTotal scope and result evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virustotal-evidence-dry-run-${{ github.run_id }}
          path: |
            binaries/associations.tsv
            binaries/scan-set.tsv
            binaries/vt-results.tsv
          if-no-files-found: warn

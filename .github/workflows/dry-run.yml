# Manual trigger: test everything before pushing a release.
# Each step can be skipped for faster iteration.
#
# Pipeline:  lint → test → build + candidate scan/select → smoke/soak
# Security:  security-static + codeql-gate                    (independent island)
#
# Security does NOT block lint/test/build/smoke/soak. All jobs must pass
# for the overall workflow to be green.
#
# Candidate VirusTotal scanning and tuple-local selection are part of the
# reusable build boundary. Smoke and soak therefore start only after all 16
# stripped/unstripped candidates have completed and the selected exact bytes
# have been packaged under the canonical artifact names.
#
# The skips are independent because they answer different questions:
#   skip_builds      no artifacts at all                 "do lint and tests pass?"
#   skip_smoke       build + scan/select, no smoke       "does this diff scan red?"
#   skip_virustotal  default-stripped + smoke, no scan   "do the archives pass CI?"
#
# skip_virustotal is a conspicuous dry-run-only bypass for API-quota-sensitive
# iteration. It records unscanned-dry-run and deterministically chooses stripped
# within each tuple. release.yml has no corresponding bypass.
name: Dry Run

on:
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip lint (cppcheck + clang-format)'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip unit/integration tests'
        type: boolean
        default: false
      skip_builds:
        description: 'Skip build + smoke (also skips VirusTotal — nothing to scan)'
        type: boolean
        default: false
      skip_smoke:
        description: 'Skip smoke (candidate scan/select still runs inside build)'
        type: boolean
        default: false
      skip_virustotal:
        description: 'Skip candidate scan; mark unscanned and default to stripped'
        type: boolean
        default: false
      soak_level:
        description: 'Soak: full (quick+asan), quick (10min), none'
        type: choice
        options: ['full', 'quick', 'none']
        default: 'quick'

permissions:
  contents: read

jobs:
  # ── Security (independent island — does not block main pipeline) ──
  security:
    uses: ./.github/workflows/_security.yml
    secrets: inherit

  # ── Lint (cppcheck + clang-format) ────────────────────────────
  lint:
    if: ${{ inputs.skip_lint != true }}
    uses: ./.github/workflows/_lint.yml

  # ── Tests (all platforms, perf tests skipped on CI) ────────────
  test:
    needs: [lint]
    if: ${{ inputs.skip_tests != true && !cancelled() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true
      broad_platforms: true
      shard_suites: true

  # ── Build all platforms ────────────────────────────────────────
  build:
    if: ${{ inputs.skip_builds != true && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build.yml
    with:
      attest: false
      scan_candidates: ${{ !inputs.skip_virustotal }}
    secrets: inherit

  # ── Smoke test every binary ────────────────────────────────────
  # Run unless builds were skipped or a build leg FAILED. Every build leg
  # (including the macos-15-intel darwin-amd64 binary) is blocking now, so a
  # failed/missing platform binary correctly stops smoke — see _build.yml.
  smoke:
    if: ${{ inputs.skip_builds != true && inputs.skip_smoke != true && !cancelled() && needs.build.result != 'failure' && needs.build.result != 'skipped' }}
    needs: [build]
    uses: ./.github/workflows/_smoke.yml
    with:
      broad_platforms: true

  # ── Soak tests (optional, parallel with smoke) ────────────────
  soak:
    if: ${{ inputs.soak_level != 'none' && !cancelled() && needs.build.result != 'failure' && needs.build.result != 'skipped' }}
    needs: [build]
    uses: ./.github/workflows/_soak.yml
    with:
      duration_minutes: 10
      run_asan: ${{ inputs.soak_level == 'full' }}
      use_release_artifacts: true

  # ── VirusTotal full-surface pass (final step) ─────────────────
  # _build.yml already scans the 24 executable CANDIDATES and selects one per
  # target. This job covers everything else we ship — install.sh, install.ps1,
  # LICENSE, THIRD_PARTY_NOTICES.md, the MCPB manifest.json and the unpacked UI
  # assets — so a dry run answers the same question the release will ask, before
  # we tag anything. The only difference is where the containers come from: the
  # release pulls them off a published release, a dry run has none, so they come
  # from the build job's artifacts — the SAME bytes, produced by the same
  # canonical package-release.sh.
  #
  # Runs after smoke and soak deliberately. It is the slowest job (polling can
  # take up to two hours) and the one most likely to be waiting on someone
  # else's queue, so it must not delay the feedback that is actually about our
  # code.
  #
  # It needs smoke and soak only so it runs LAST, not because it depends on
  # them: a skipped smoke or soak leaves the scan reachable (result 'skipped',
  # which is not 'failure'), while a FAILED one withholds it — if the artifacts
  # are broken, a verdict on them is not worth two hours of polling.
  virustotal:
    if: ${{ inputs.skip_builds != true && inputs.skip_virustotal != true && !cancelled() && needs.build.result == 'success' && needs.smoke.result != 'failure' && needs.soak.result != 'failure' }}
    needs: [build, smoke, soak]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-archives

      - name: Download the candidate-selection evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-selection-evidence
          path: ${{ runner.temp }}/selection-evidence

      # Same extraction the release verify job performs, over the same container
      # set: 14 = 8 archives + 6 MCPB bundles; runtime 42 = 8x3 archive sidecars
      # + 6x3 bundle members. VirusTotal receives only extracted release objects,
      # never .tar.gz/.zip/.mcpb containers.
      - name: Extract archive artifacts
        run: |
          scripts/ci/extract-release-archives.sh "$RUNNER_TEMP/release-archives" binaries \
            --expect-archives=14 \
            --expect-binaries=14 \
            --expect-runtime-files=42

      # The selected executables were already scanned as candidates in
      # _build.yml, and identity is settled by SHA-256, so re-submitting them
      # adds no assurance and costs a second, independently-timed verdict.
      # Reached only when skip_virustotal is false, i.e. when the candidate scan
      # this withholding relies on actually ran.
      - name: Withhold already-scanned selected executables
        run: |
          bash scripts/ci/exclude-rescanned-selected-objects.sh \
            binaries/objects "$RUNNER_TEMP/selection-evidence/release-selection.tsv" \
            binaries/virustotal-withheld.tsv

      - name: VirusTotal scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        id: virustotal
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_SCANNER_API_KEY }}
          files: binaries/objects/*
          request_rate: 4

      # Same policy as the release and candidate gates: a single Microsoft `!ml`
      # is tolerated and disclosed, anything else blocks. Engine count is
      # evidence, not a gate.
      - name: Wait for VirusTotal results
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_SCANNER_API_KEY }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
          VT_EXPECTED_SCAN_SET: binaries/scan-set.tsv
          VT_ASSOCIATIONS: binaries/associations.tsv
          VT_RESULTS_PATH: binaries/vt-results.tsv
          VT_WITHHELD: binaries/virustotal-withheld.tsv
          MIN_ENGINES: 50
        run: scripts/ci/check-virustotal.sh

      - name: Preserve VirusTotal scope and result evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virustotal-evidence-dry-run-${{ github.run_id }}
          path: |
            binaries/associations.tsv
            binaries/scan-set.tsv
            binaries/vt-results.tsv
            binaries/virustotal-withheld.tsv
          if-no-files-found: warn

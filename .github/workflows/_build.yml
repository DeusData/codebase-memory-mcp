# Reusable: build release binaries on all supported platforms
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. v0.8.0)'
        type: string
        default: ''
      attest:
        description: 'Generate build provenance attestations for release artifacts'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            cxx: g++
          - os: macos-14
            goos: darwin
            goarch: arm64
            cc: cc
            cxx: c++
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            cc: cc
            cxx: c++
    runs-on: ${{ matrix.os }}
    # Every leg is BLOCKING — no continue-on-error. The darwin-amd64 binary
    # built on macos-15-intel must ship with every release; if that runner is
    # unavailable the build fails loudly rather than silently publishing a
    # release with no Intel macOS binary (a user-reported gap). macos-15-intel
    # is GitHub's supported Intel image through Aug 2027 (the last x86_64 macOS
    # runner); revisit the Intel leg before that retirement.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI
        env:
          VERSION: ${{ inputs.version }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" "CC=$CC" "CXX=$CXX"
          else
            scripts/build.sh --with-ui "CC=$CC" "CXX=$CXX"
          fi

      - name: Ad-hoc sign macOS release binary
        if: startsWith(matrix.os, 'macos')
        run: codesign --sign - --force build/c/codebase-memory-mcp

      - name: Frontend integrity scan
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: scripts/security-ui.sh

      # Archive layout/name live in the ONE canonical script the local
      # artifact-flow smoke lane also runs (venue-parity contract).
      - name: Archive release binary (canonical package-release.sh)
        run: scripts/package-release.sh ${{ matrix.goos }} ${{ matrix.goarch }}

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            make
            zip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh --with-ui CC=clang CXX=clang++
          fi

      # Archive layout/name live in the ONE canonical script the local
      # artifact-flow smoke lane also runs (venue-parity contract).
      - name: Archive release binary (canonical package-release.sh)
        shell: msys2 {0}
        run: scripts/package-release.sh windows amd64 CC=clang CXX=clang++

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-windows-amd64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-windows-amd64
          path: "*.zip"

  build-windows-arm64:
    # Native ARM64 Windows binary via the CLANGARM64 toolchain on the
    # windows-11-arm runner (the same toolchain the test suite already
    # exercises). Without it, ARM-Windows users fall back to the x86_64
    # binary under emulation, and npm/pip on native-ARM Node/Python 404.
    runs-on: windows-11-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-zlib
            make
            zip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh --with-ui CC=clang CXX=clang++
          fi

      - name: Archive release binary (canonical package-release.sh)
        shell: msys2 {0}
        run: scripts/package-release.sh windows arm64 CC=clang CXX=clang++

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-windows-arm64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-windows-arm64
          path: "*.zip"

  build-linux-portable:
    # Fully static Linux binaries (gcc -static on Ubuntu).
    # Runs on any Linux distro without shared library dependencies.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI (static)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=gcc CXX=g++ STATIC=1
          else
            scripts/build.sh --with-ui CC=gcc CXX=g++ STATIC=1
          fi

      - name: Verify release static linking
        run: |
          file build/c/codebase-memory-mcp
          ldd build/c/codebase-memory-mcp 2>&1 | grep -q "not a dynamic executable" || ldd build/c/codebase-memory-mcp 2>&1 | grep -q "statically linked"

      - name: Archive release binary (canonical package-release.sh)
        run: scripts/package-release.sh linux ${{ matrix.arch }}-portable

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-linux-${{ matrix.arch }}-portable.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux-${{ matrix.arch }}-portable
          path: "*.tar.gz"

  build-freebsd:
    name: build-unix (freebsd-${{ matrix.release }}, freebsd, ${{ matrix.arch }}, clang, clang++)
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.4']
        arch: ['x86_64']
        # arch: ['x86_64', 'aarch64']
        # aarch64 disabled for now: lightningcss (a native Rust dependency of
        # the Vite/CSS build pipeline) publishes no prebuilt binary for
        # freebsd-arm64, so `npm run build` fails with "Cannot find module
        # '../lightningcss.freebsd-arm64.node'" — a real gap in that
        # package's platform coverage, not something fixable on our side
        # without vendoring a Rust build of it. Re-enable once lightningcss
        # ships that target, or once the frontend build is moved to run
        # natively on a Linux host instead of inside the FreeBSD VM.
        include:
          - arch: x86_64
            artifact_arch: amd64
            sync: rsync
          # - arch: aarch64
          #  artifact_arch: arm64-aarch64
          #  sync: scp
    # Must use ubuntu-latest (x86_64 host). Running QEMU guest emulation on arm runners (ubuntu-*-arm)
    # causes severe performance degradation leading to 3+ hour timeouts.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build FreeBSD ${{ matrix.release }} (${{ matrix.arch }}) binaries inside VM
        # https://github.com/vmactions/freebsd-vm
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          # Sync options: rsync, sshfs, nfs, scp
          sync: ${{ matrix.sync }}
          usesh: true
          mem: 6144
          cpu: 4
          prepare: |
            pkg update -f
            pkg install -y gmake sqlite3 pkgconf node22 npm-node22 bash
            which python3 >/dev/null 2>&1 || ln -sf $(which python3.15 python3.14 python3.13 python3.12 python3.11 python3.10 2>/dev/null | head -n 1) /usr/local/bin/python3
          run: |
            # Build standard binary (canonical scripts/build.sh pattern)
            if [ -n "${{ inputs.version }}" ]; then
              scripts/build.sh --version "${{ inputs.version }}" CC=clang CXX=clang++
            else
              scripts/build.sh CC=clang CXX=clang++
            fi
            scripts/package-release.sh freebsd ${{ matrix.arch }}-${{ matrix.release }}

            # Build UI binary
            if [ -n "${{ inputs.version }}" ]; then
              scripts/build.sh --version "${{ inputs.version }}" --with-ui CC=clang CXX=clang++
            else
              scripts/build.sh --with-ui CC=clang CXX=clang++
            fi
            scripts/package-release.sh freebsd ${{ matrix.arch }}-${{ matrix.release }} --variant ui

      - name: Attest standard binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-freebsd-${{ matrix.artifact_arch }}-${{ matrix.release }}.tar.gz

      - name: Attest UI binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-ui-freebsd-${{ matrix.artifact_arch }}-${{ matrix.release }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-freebsd-${{ matrix.artifact_arch }}-${{ matrix.release }}
          path: "*.tar.gz"


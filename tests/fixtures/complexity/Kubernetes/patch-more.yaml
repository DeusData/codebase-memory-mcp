apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  mode: patched
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  annotations:
    patched: "true"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    patched: "true"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  maxReplicas: 9
